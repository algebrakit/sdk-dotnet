name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build (.NET Standard 2.0, .NET 8, tests and demo)
        run: dotnet build sdk-dotnet.sln -c Release
      - name: Test
        run: dotnet test sdk-dotnet.sln -c Release --no-build
      - name: Check that the package builds
        run: dotnet pack AlgebrakitSDK/AlgebrakitSDK.csproj -c Release --no-build -o artifacts
